name: v090-scope-fix

on:
  push:
    branches:
      - agent/v0.9.0-intent-boundary
    paths:
      - .github/workflows/v090-scope-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/v0.9.0-intent-boundary
          fetch-depth: 0
      - name: Apply targeted scope fix
        run: python .github/scripts/v090_scope_fix.py
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Install plugin dependencies
        run: npm ci
        working-directory: plugins/cogentnexus-rotation
      - name: Plugin tests
        run: npm test
        working-directory: plugins/cogentnexus-rotation
      - name: Plugin evaluation
        run: npm run evaluation
        working-directory: plugins/cogentnexus-rotation
      - name: Plugin contract validation
        run: npm run plugin:validate
        working-directory: plugins/cogentnexus-rotation
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/cogentnexus-rotation/src/v090.ts
          git rm .github/workflows/v090-scope-fix.yml .github/scripts/v090_scope_fix.py
          git commit -m 'Fix terminal recovery fence scope'
          git push origin HEAD:agent/v0.9.0-intent-boundary

name: Patch delivery and compaction continuity

on:
  push:
    branches:
      - "baseline/v0.8.0-clean"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: baseline/v0.8.0-clean
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Fix patch helper escaping
        run: python scripts/fix_delivery_patch_helper.py
      - name: Apply source patch
        run: python scripts/apply_delivery_compaction_patch.py
      - name: Compile plugin and generated metadata
        working-directory: plugins/cogentnexus-rotation
        run: |
          npm ci
          npm run build
          npm run plugin:build
      - name: Commit patched runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            plugins/cogentnexus-rotation/src/index.ts \
            plugins/cogentnexus-rotation/src/ticket-store.ts \
            plugins/cogentnexus-rotation/openclaw.plugin.json \
            plugins/cogentnexus-rotation/package.json \
            skills/cogentnexus/scripts/host.py
          if git diff --cached --quiet; then
            echo "No runtime patch changes."
            exit 0
          fi
          git commit -m "Harden delivery receipts and post-compaction continuation"
          git push origin HEAD:baseline/v0.8.0-clean

name: v0.9.5 validation convergence once

on:
  push:
    branches:
      - fix/v0.9.5-validation-convergence
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply exact v0.9.5 convergence fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              s2 = s.replace(old, new)
              if s2 == s:
                  raise SystemExit(f'no change made to {path}')
              p.write_text(s2, encoding='utf-8')

          p = Path('skills/cogentnexus-openclaw/scripts/namespace_ownership.py')
          s = p.read_text(encoding='utf-8')
          sig = 'def _exact_rollover_state(\n'
          i = s.find(sig)
          if i < 0:
              raise SystemExit('cannot locate _exact_rollover_state')
          marker = '    root: Path,\n    workspace: Path,\n'
          j = s.find(marker, i)
          if j < 0:
              raise SystemExit('cannot locate _exact_rollover_state parameters')
          s = s[:j] + s[j:].replace(marker, '    root: Path,\n    workspace: Path,\n    application_data: Path,\n', 1)
          anchor = '    workspace = workspace.resolve(strict=False)\n'
          k = s.find(anchor, s.find(sig))
          if k < 0:
              raise SystemExit('cannot locate rollover-state workspace normalization')
          insertion = anchor + '    application_data = application_data.resolve(strict=False)\n    if application_data.name.lower() != DISPLAY_NAME.lower() or _contained(\n        application_data, openclaw_state\n    ):\n        raise RuntimeError("rollover application-data root must be the external CogentNexus-OpenClaw boundary")\n'
          s = s[:k] + s[k:].replace(anchor, insertion, 1)
          p.write_text(s, encoding='utf-8')

          replace('tests/test_plugin_generation_rollover.py',
                  'def write_plugin(root: Path, *, marker: str = "same", version: str = "0.9.4") -> Path:',
                  'def write_plugin(root: Path, *, marker: str = "same", version: str = "0.9.5") -> Path:')
          replace('tests/test_namespace_ownership.py',
                  'def write_plugin(root: Path, *, marker="same", version="0.9.4") -> Path:',
                  'def write_plugin(root: Path, *, marker="same", version="0.9.5") -> Path:')
          replace('tests/test_namespace_ownership.py',
                  '                                       launcher=launcher, version="0.9.4", migration_source=migration_source)',
                  '                                       launcher=launcher, version=ownership.INSTALLED_VERSION, migration_source=migration_source)')
          replace('tests/test_lifecycle_v092.py', '                "0.9.4",\n', '                "0.9.5",\n')
          replace('tests/test_lifecycle_v092.py', '            write_payload(managed, "0.9.4")', '            write_payload(managed, "0.9.5")')
          replace('tests/test_lifecycle_v092.py', '            write_payload(first, "0.9.4")', '            write_payload(first, "0.9.5")')
          replace('tests/test_lifecycle_v092.py', '            write_payload(second, "0.9.4")', '            write_payload(second, "0.9.5")')
          replace('tests/test_lifecycle_v092.py', '            write_payload(first, "0.9.4", bootstrap_text="a\\n", ticket_text="same\\n")', '            write_payload(first, "0.9.5", bootstrap_text="a\\n", ticket_text="same\\n")')
          replace('tests/test_lifecycle_v092.py', '            write_payload(second, "0.9.4", bootstrap_text="b\\n", ticket_text="same\\n")', '            write_payload(second, "0.9.5", bootstrap_text="b\\n", ticket_text="same\\n")')
          replace('tests/test_namespace_ownership.py',
                  '        payload["installedVersion"] = "0.9.3"',
                  '        payload["installedVersion"] = "0.9.4"')
          replace('tests/test_baseline_checker_v093.py', '== "0.9.4"', '== "0.9.5"')
          replace('tests/test_baseline_contract.py', 'self.assertEqual(core_version, "0.9.4")', 'self.assertEqual(core_version, "0.9.5")')
          replace('tests/test_namespace_install_contract.py', 'name="cogentnexus-openclaw-v0.9.4"', 'name="cogentnexus-openclaw-v0.9.5"')
          replace('tests/test_release_version_094_contract.py', 'EXPECTED = "0.9.4"', 'EXPECTED = "0.9.5"')
          replace('docs/CLEAN_REINSTALL.md', 'then runs the v0.9.4 installer', 'then runs the v0.9.5 installer')
          replace('docs/CLEAN_REINSTALL.th.md', 'ติดตั้ง v0.9.4 ใหม่', 'ติดตั้ง v0.9.5 ใหม่')

      - name: Check focused regression set
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_plugin_generation_rollover.py \
            tests/test_interrupted_reentry_semantic_matrix.py \
            tests/test_namespace_ownership.py \
            tests/test_lifecycle_v092.py \
            tests/test_baseline_checker_v093.py \
            tests/test_baseline_contract.py \
            tests/test_namespace_install_contract.py \
            tests/test_clean_reinstall_docs_contract.py \
            tests/test_release_version_094_contract.py

      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/v095-validation-convergence-once.yml
          git add -A
          git diff --cached --check
          git diff --cached --name-status
          git commit -m 'fix: converge v0.9.5 validation contracts'
          git push origin HEAD:fix/v0.9.5-validation-convergence

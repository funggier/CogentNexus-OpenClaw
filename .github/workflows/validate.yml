name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: plugins/cogentnexus-rotation/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_baseline_consistency.py
      - run: python skills/cogentnexus/scripts/validate.py --workspace-singleton
      - run: python skills/cogentnexus/scripts/cogent.py self-test
      - run: python skills/cogentnexus/scripts/runtime.py self-test
      - name: Workflow self-test
        if: runner.os != 'Windows'
        run: python skills/cogentnexus/scripts/workflow.py self-test
      - name: Workflow self-test on Windows with one teardown-race retry
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python skills/cogentnexus/scripts/workflow.py self-test
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Workflow self-test hit the known detached-controller teardown race; retrying once."
            python skills/cogentnexus/scripts/workflow.py self-test
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python -m py_compile skills/cogentnexus/scripts/host.py skills/cogentnexus/scripts/host_v091.py skills/cogentnexus/scripts/host_control.py skills/cogentnexus/scripts/host_control_v091.py skills/cogentnexus/scripts/startup.py skills/cogentnexus/scripts/startup_v091.py
      - run: python -m unittest discover -s tests -v
      - run: python benchmarks/single-ai-hybrid-e2e/test_validator.py
      - name: Test plugin path migration helper
        shell: bash
        run: |
          printf '["/tmp/cogentnexus-rotation","/tmp/keep"]' | \
            python scripts/filter_plugin_paths.py --plugin-id cogentnexus-rotation | \
            python -c 'import json,sys; assert json.load(sys.stdin) == ["/tmp/keep"]'
      - name: Validate PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Validate POSIX installer syntax
        if: runner.os != 'Windows'
        run: sh -n scripts/install.sh
      - run: npm ci
        working-directory: plugins/cogentnexus-rotation
      - run: npm test
        working-directory: plugins/cogentnexus-rotation
      - run: npm run evaluation
        working-directory: plugins/cogentnexus-rotation
      - run: npm audit --omit=dev
        working-directory: plugins/cogentnexus-rotation
      - run: npm run plugin:validate
        working-directory: plugins/cogentnexus-rotation

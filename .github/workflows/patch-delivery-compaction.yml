    });
  } catch (error) {
    store.markOutboxFailed(item.outboxId,error instanceof Error ? error.message : String(error));
    throw error;
  }
}
'''
          text, count = re.subn(r'export async function deliverTicketOutbox\([\s\S]*?\n}\n\nexport function enforcementDecision', ticket_delivery_fn + '\nexport function enforcementDecision', text, count=1)

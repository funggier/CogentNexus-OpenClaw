name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python skills/cogentnexus/scripts/validate.py --workspace-singleton
      - run: python skills/cogentnexus/scripts/cogent.py self-test
      - run: python skills/cogentnexus/scripts/phase3.py self-test

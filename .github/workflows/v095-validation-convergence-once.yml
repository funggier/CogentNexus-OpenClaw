name: v0.9.5 validation convergence once

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/v0.9.5-validation-convergence]

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply exact v0.9.5 convergence fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace(path, old, new, required=True):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              if old not in s:
                  if required:
                      raise SystemExit(f"pattern not found in {path}: {old!r}")
                  return False
              updated = s.replace(old, new)
              if updated == s:
                  raise SystemExit(f"no change made to {path}")
              p.write_text(updated, encoding="utf-8")
              return True

          # Production: pass the same externally-bound application-data root
          # already used by the plan/apply path into every exact-state check.
          p = Path("skills/cogentnexus-openclaw/scripts/namespace_ownership.py")
          s = p.read_text(encoding="utf-8")
          sig = r"def _exact_rollover_state\(\*, root: Path, workspace: Path,\n"
          s, count = re.subn(
              sig,
              "def _exact_rollover_state(*, root: Path, workspace: Path,\\n                          application_data: Path,\\n",
              s,
              count=1,
          )
          if count != 1:
              raise SystemExit("could not locate _exact_rollover_state signature")

          old_apply = '''state = _exact_rollover_state(\n            root=root, workspace=workspace, plugin_inventory=plugin_inventory,\n            expected_replacement_fingerprint=expected_replacement_fingerprint,\n        )'''
          new_apply = '''state = _exact_rollover_state(\n            root=root, workspace=workspace,\n            application_data=application_data,\n            plugin_inventory=plugin_inventory,\n            expected_replacement_fingerprint=expected_replacement_fingerprint,\n        )'''
          if old_apply not in s:
              raise SystemExit("could not locate apply_plugin_rollover_plan exact-state call")
          s = s.replace(old_apply, new_apply, 1)

          old_classify = '''state = _exact_rollover_state(\n                root=paths["stateRoot"], workspace=workspace,\n                plugin_inventory=plugin_inventory,\n                expected_replacement_fingerprint=expected_replacement_fingerprint,\n            )'''
          new_classify = '''state = _exact_rollover_state(\n                root=paths["stateRoot"], workspace=workspace,\n                application_data=app_data or paths["applicationData"],\n                plugin_inventory=plugin_inventory,\n                expected_replacement_fingerprint=expected_replacement_fingerprint,\n            )'''
          if old_classify not in s:
              raise SystemExit("could not locate classify_install exact-state call")
          s = s.replace(old_classify, new_classify, 1)

          # Keep the application-data invariant inside the shared helper too.
          marker = '''    paths = expected_paths(workspace)\n    mode = _require_passthrough(root)'''
          replacement = '''    paths = expected_paths(workspace)\n    application_data = application_data.resolve(strict=False)\n    if application_data.name.lower() != DISPLAY_NAME.lower() or _contained(\n        application_data, paths["openclawState"]\n    ):\n        raise RuntimeError("rollover application-data root must be the external CogentNexus-OpenClaw boundary")\n    mode = _require_passthrough(root)'''
          if marker not in s:
              raise SystemExit("could not locate exact-state initialization")
          s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding="utf-8")

          # Current-version fixture defaults.
          replace(
              "tests/test_plugin_generation_rollover.py",
              'def write_plugin(root: Path, *, marker: str = "same", version: str = "0.9.4") -> Path:',
              'def write_plugin(root: Path, *, marker: str = "same", version: str = "0.9.5") -> Path:',
          )
          replace(
              "tests/test_plugin_generation_rollover.py",
              '            "version": "0.9.4",',
              '            "version": "0.9.5",',
              required=False,
          )
          replace(
              "tests/test_namespace_ownership.py",
              'def write_plugin(root: Path, *, marker="same", version="0.9.4") -> Path:',
              'def write_plugin(root: Path, *, marker="same", version="0.9.5") -> Path:',
          )

          lp = Path("tests/test_lifecycle_v092.py")
          ls = lp.read_text(encoding="utf-8")
          ls = ls.replace('                "0.9.4",\n', '                "0.9.5",\n')
          ls = ls.replace('write_payload(managed, "0.9.4")', 'write_payload(managed, "0.9.5")')
          ls = ls.replace('write_payload(first, "0.9.4"', 'write_payload(first, "0.9.5"')
          ls = ls.replace('write_payload(second, "0.9.4"', 'write_payload(second, "0.9.5"')
          lp.write_text(ls, encoding="utf-8")

          # v0.9.5 is the current release; v0.9.4 is the immediate upgrade source.
          replace(
              "tests/test_namespace_ownership.py",
              'payload["installedVersion"] = "0.9.3"',
              'payload["installedVersion"] = "0.9.4"',
              required=False,
          )
          replace(
              "tests/test_plugin_generation_rollover.py",
              '            "version": "0.9.4",\n',
              '            "version": "0.9.5",\n',
              required=False,
          )
          replace(
              "tests/test_plugin_generation_rollover.py",
              '            "version": ownership.UPGRADE_FROM_VERSIONS[0],',
              '            "version": ownership.UPGRADE_FROM_VERSIONS[0],',
              required=False,
          )

          replace("tests/test_baseline_checker_v093.py",
                  'assert (tree / "VERSION").read_text(encoding="utf-8").strip() == "0.9.4"',
                  'assert (tree / "VERSION").read_text(encoding="utf-8").strip() == "0.9.5"',
                  required=False)
          replace("tests/test_baseline_contract.py",
                  'self.assertEqual(core_version, "0.9.4")',
                  'self.assertEqual(core_version, "0.9.5")',
                  required=False)
          replace("tests/test_baseline_contract.py",
                  'self.assertEqual(bridge_version, "0.9.4")',
                  'self.assertEqual(bridge_version, "0.9.5")',
                  required=False)
          replace("tests/test_namespace_install_contract.py",
                  'name="cogentnexus-openclaw-v0.9.4"',
                  'name="cogentnexus-openclaw-v0.9.5"',
                  required=False)
          replace("tests/test_release_version_094_contract.py",
                  'EXPECTED = "0.9.4"',
                  'EXPECTED = "0.9.5"',
                  required=False)
          replace("tests/test_release_version_094_contract.py",
                  'assert "v0.9.4" in text, relative',
                  'assert "v0.9.5" in text, relative',
                  required=False)
          replace("docs/CLEAN_REINSTALL.md",
                  'then runs the v0.9.4 installer',
                  'then runs the v0.9.5 installer',
                  required=False)
          replace("docs/CLEAN_REINSTALL.th.md",
                  'ติดตั้ง v0.9.4 ใหม่',
                  'ติดตั้ง v0.9.5 ใหม่',
                  required=False)

      - name: Check focused regression set
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m pytest -q \
            tests/test_plugin_generation_rollover.py \
            tests/test_interrupted_reentry_semantic_matrix.py \
            tests/test_namespace_ownership.py \
            tests/test_lifecycle_v092.py \
            tests/test_baseline_checker_v093.py \
            tests/test_baseline_contract.py \
            tests/test_namespace_install_contract.py \
            tests/test_clean_reinstall_docs_contract.py \
            tests/test_release_version_094_contract.py

      - name: Commit fixes and remove one-shot workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/v095-validation-convergence-once.yml
          git add -A
          git diff --cached --check
          git diff --cached --name-status
          git commit -m 'fix: converge v0.9.5 validation contracts'
          git push origin HEAD:fix/v0.9.5-validation-convergence

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/cogentnexus-rotation/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: python skills/cogentnexus/scripts/validate.py --workspace-singleton
      - run: python skills/cogentnexus/scripts/cogent.py self-test
      - run: python skills/cogentnexus/scripts/runtime.py self-test
      - name: Test plugin path migration helper
        shell: bash
        run: |
          printf '["/tmp/cogentnexus-rotation","/tmp/keep"]' | \
            python scripts/filter_plugin_paths.py --plugin-id cogentnexus-rotation | \
            python -c 'import json,sys; assert json.load(sys.stdin) == ["/tmp/keep"]'
      - run: npm ci
        working-directory: plugins/cogentnexus-rotation
      - run: npm test
        working-directory: plugins/cogentnexus-rotation
      - run: npm run evaluation
        working-directory: plugins/cogentnexus-rotation
      - run: npm audit --omit=dev
        working-directory: plugins/cogentnexus-rotation
      - run: npm run plugin:validate
        working-directory: plugins/cogentnexus-rotation
      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          package_version=$(node -p "require('./plugins/cogentnexus-rotation/package.json').version")
          manifest_version=$(node -p "JSON.parse(require('fs').readFileSync('./plugins/cogentnexus-rotation/openclaw.plugin.json')).version")
          test "$expected" = "$package_version"
          test "$expected" = "$manifest_version"
      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          name="cogentnexus-${GITHUB_REF_NAME}"
          stage="$RUNNER_TEMP/$name"
          out="$RUNNER_TEMP/release"
          mkdir -p "$stage" "$out"
          rsync -a \
            --exclude '.git/' \
            --exclude '.cogent/' \
            --exclude 'node_modules/' \
            ./ "$stage/"
          tar -C "$RUNNER_TEMP" -czf "$out/$name.tar.gz" "$name"
          (cd "$RUNNER_TEMP" && zip -qr "$out/$name.zip" "$name")
          (cd "$out" && sha256sum "$name.tar.gz" "$name.zip" > SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release/cogentnexus-$GITHUB_REF_NAME.tar.gz" \
            "$RUNNER_TEMP/release/cogentnexus-$GITHUB_REF_NAME.zip" \
            "$RUNNER_TEMP/release/SHA256SUMS.txt" \
            --verify-tag \
            --generate-notes \
            --title "CogentNexus $GITHUB_REF_NAME"

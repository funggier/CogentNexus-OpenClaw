          )

          registration_anchor = '  const config = (api.pluginConfig ?? {}) as RotationConfig;\n  const scheduledRuns = new Set<string>();\n'
          registration_block = r'''  const config = (api.pluginConfig ?? {}) as RotationConfig;
  const scheduledRuns = new Set<string>();

name: Prepare v0.8.4

on:
  push:
    branches:
      - agent/direct-recovery-v084
    paths:
      - .github/workflows/prepare-v084.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/direct-recovery-v084
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Apply v0.8.4 release preparation
        run: python scripts/prepare_v084.py
      - name: Verify release metadata consistency
        run: python scripts/check_baseline_consistency.py
      - name: Commit prepared v0.8.4 metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION README.md docs/BASELINE.md docs/releases/v0.8.4.md \
            plugins/cogentnexus-rotation/package.json \
            plugins/cogentnexus-rotation/package-lock.json \
            plugins/cogentnexus-rotation/openclaw.plugin.json \
            plugins/cogentnexus-rotation/src/v084.ts \
            plugins/cogentnexus-rotation/src/v084.test.ts
          git diff --cached --check
          git commit -m "Prepare CogentNexus v0.8.4 release"
          git push origin HEAD:agent/direct-recovery-v084

name: Apply v0.8.2 provider recovery fix

on:
  push:
    branches:
      - fix/v0.8.2-provider-recovery-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/cogentnexus-rotation/package-lock.json
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply provider recovery patch
        run: python .github/patch_v082_provider.py
      - name: Validate baseline and Python regressions
        run: |
          python scripts/check_baseline_consistency.py
          python -m py_compile skills/cogentnexus/scripts/host.py skills/cogentnexus/scripts/runtime.py
          python -m unittest discover -s tests -v
      - name: Validate plugin suite
        working-directory: plugins/cogentnexus-rotation
        run: |
          npm ci
          npm test
          npm run evaluation
          npm audit --omit=dev
          npm run plugin:validate
      - name: Remove temporary patch machinery
        run: |
          rm .github/patch_v082_provider.py
          rm .github/workflows/apply-v082-provider-fix.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix managed Ollama recovery authority for v0.8.2"
          git push origin HEAD:fix/v0.8.2-provider-recovery-authority

name: v0.9.5 validation convergence once

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/v0.9.5-validation-convergence]

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply exact v0.9.5 convergence fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace(path, old, new, required=True):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  if required:
                      raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
                  return
              p.write_text(s.replace(old, new), encoding='utf-8')

          p = Path('skills/cogentnexus-openclaw/scripts/namespace_ownership.py')
          s = p.read_text(encoding='utf-8')
          pattern = r'(def _exact_rollover_state\(\*, root: Path, workspace: Path,\n)'
          s2, count = re.subn(pattern, r'\1                          application_data: Path,\n', s, count=1)
          if count != 1:
              raise SystemExit('could not locate _exact_rollover_state signature')
          p.write_text(s2, encoding='utf-8')

          replace('tests/test_plugin_generation_rollover.py',
                  'def write_plugin(root: Path, *, marker: str = "same", version: str = "0.9.4") -> Path:',
                  'def write_plugin(root: Path, *, marker: str = "same", version: str = "0.9.5") -> Path:')
          replace('tests/test_namespace_ownership.py',
                  'def write_plugin(root: Path, *, marker="same", version="0.9.4") -> Path:',
                  'def write_plugin(root: Path, *, marker="same", version="0.9.5") -> Path:')
          replace('tests/test_namespace_ownership.py',
                  '                                       launcher=launcher, version="0.9.4", migration_source=migration_source)',
                  '                                       launcher=launcher, version=ownership.INSTALLED_VERSION, migration_source=migration_source)',
                  required=False)

          lp = Path('tests/test_lifecycle_v092.py')
          ls = lp.read_text(encoding='utf-8')
          ls = ls.replace('                "0.9.4",\n', '                "0.9.5",\n')
          ls = ls.replace('"0.9.4")', '"0.9.5")')
          lp.write_text(ls, encoding='utf-8')

          replace('tests/test_namespace_ownership.py',
                  '        payload["installedVersion"] = "0.9.3"',
                  '        payload["installedVersion"] = "0.9.4"',
                  required=False)
          replace('tests/test_baseline_checker_v093.py', '== "0.9.4"', '== "0.9.5"', required=False)
          replace('tests/test_baseline_contract.py', 'self.assertEqual(core_version, "0.9.4")', 'self.assertEqual(core_version, "0.9.5")', required=False)
          replace('tests/test_namespace_install_contract.py', 'name="cogentnexus-openclaw-v0.9.4"', 'name="cogentnexus-openclaw-v0.9.5"', required=False)
          replace('tests/test_release_version_094_contract.py', 'EXPECTED = "0.9.4"', 'EXPECTED = "0.9.5"', required=False)
          replace('docs/CLEAN_REINSTALL.md', 'then runs the v0.9.4 installer', 'then runs the v0.9.5 installer', required=False)
          replace('docs/CLEAN_REINSTALL.th.md', 'ติดตั้ง v0.9.4 ใหม่', 'ติดตั้ง v0.9.5 ใหม่', required=False)

      - name: Check focused regression set
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m pytest -q \
            tests/test_plugin_generation_rollover.py \
            tests/test_interrupted_reentry_semantic_matrix.py \
            tests/test_namespace_ownership.py \
            tests/test_lifecycle_v092.py \
            tests/test_baseline_checker_v093.py \
            tests/test_baseline_contract.py \
            tests/test_namespace_install_contract.py \
            tests/test_clean_reinstall_docs_contract.py \
            tests/test_release_version_094_contract.py

      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/v095-validation-convergence-once.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix: converge v0.9.5 validation contracts'
          git push origin HEAD:fix/v0.9.5-validation-convergence

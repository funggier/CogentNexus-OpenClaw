name: Stabilization Repair Installer

on:
  push:
    branches:
      - agent/v0.9.3-full-stabilization
    paths:
      - .github/workflows/cnx-stabilization-repair-installer.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Restore proven installer and qualify exact namespace wording
        shell: bash
        run: |
          set -euo pipefail
          git show e6af5a6a0f4e9fa0f864f41572d15241d9aba2b7:scripts/install.ps1 > scripts/install.ps1
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/install.ps1")
          data = path.read_bytes()
          old = b"# Fresh install is allowed only when no CogentNexus-owned runtime is present."
          new = b"# Fresh install is allowed only when no CogentNexus-OpenClaw-owned runtime is present."
          if data.count(old) != 1:
              raise SystemExit(f"expected exactly one namespace wording target, found {data.count(old)}")
          path.write_bytes(data.replace(old, new))
          PY
          git diff --check
      - name: Verify namespace and installer transaction proofs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python scripts/check_namespace_isolation.py
          python -m pytest -q tests/test_fresh_transaction_failure_coverage.py tests/test_installer_mode_isolation.py
      - name: Publish exact repair and retire temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/cnx-stabilization-repair-installer.yml
          git config user.name "CogentNexus Stabilization"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/install.ps1 .github/workflows/cnx-stabilization-repair-installer.yml
          git diff --cached --check
          git commit -m "fix(installer): restore transaction proof structure"
          git push origin HEAD:agent/v0.9.3-full-stabilization

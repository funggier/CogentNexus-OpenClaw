name: v090-live-cancellation-fix

on:
  push:
    branches:
      - agent/v0.9.0-intent-boundary
    paths:
      - .github/workflows/v090-live-cancellation-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/v0.9.0-intent-boundary
          fetch-depth: 0

      - name: Patch Host cancellation fences
        shell: python
        run: |
          from pathlib import Path

          p = Path('skills/cogentnexus/scripts/host.py')
          s = p.read_text(encoding='utf-8')

          if 'def reconcile_terminal_fences(' not in s:
              marker = '\ndef cancel_ticket(root: Path, ticket_id: str, reason: str) -> dict[str, Any]:\n'
              helper = '''
          def reconcile_terminal_fences(root: Path) -> dict[str, int]:
              """Suppress stale work that conflicts with terminal human intent."""
              path = ticket_db(root)
              if not path.exists():
                  return {"cancelledOutboxSuppressed": 0, "terminalRecoverySuppressed": 0, "cancelledClassificationNormalized": 0}
              db = sqlite3.connect(path, timeout=5)
              try:
                  if not table_exists(db, "tickets"):
                      return {"cancelledOutboxSuppressed": 0, "terminalRecoverySuppressed": 0, "cancelledClassificationNormalized": 0}
                  db.execute("BEGIN IMMEDIATE")
                  normalized = db.execute("UPDATE tickets SET failure_class=NULL WHERE status='cancelled' AND failure_class IS NOT NULL").rowcount
                  cancelled_outbox = 0
                  recovery_suppressed = 0
                  if table_exists(db, "ticket_outbox"):
                      cancelled_outbox = db.execute("DELETE FROM ticket_outbox WHERE delivery_status='pending' AND ticket_id IN (SELECT ticket_id FROM tickets WHERE status='cancelled')").rowcount
                  if table_exists(db, "cnx_direct_recovery"):
                      recovery_suppressed = db.execute(
                          "UPDATE cnx_direct_recovery SET state='cancelled',active_run_id=NULL,next_attempt_at=NULL,last_error=COALESCE(last_error,'terminal ticket fence'),updated_at=? WHERE state<>'cancelled' AND ticket_id IN (SELECT ticket_id FROM tickets WHERE status IN ('completed','failed','cancelled'))",
                          (now_iso(),),
                      ).rowcount
                  db.commit()
                  return {
                      "cancelledOutboxSuppressed": int(cancelled_outbox),
                      "terminalRecoverySuppressed": int(recovery_suppressed),
                      "cancelledClassificationNormalized": int(normalized),
                  }
              except Exception:
                  db.rollback()
                  raise
              finally:
                  db.close()
          '''
              helper = '\n'.join(line[10:] if line.startswith('          ') else line for line in helper.splitlines()) + '\n'
              if marker not in s:
                  raise SystemExit('cancel_ticket marker missing')
              s = s.replace(marker, helper + marker, 1)

          old = '''            if table_exists(db, "ticket_outbox"):
                payload = json.dumps({"classification": "interrupted", "message": reason, "source": "host"})
                db.execute(
                    "INSERT OR IGNORE INTO ticket_outbox(ticket_id,owner_session_key,terminal_status,payload_json,delivery_status,created_at) VALUES (?,?,'cancelled',?,'pending',?)",
                    (ticket_id, row["owner_session_key"], payload, stamp),
                )
          '''
          new = '''            if table_exists(db, "ticket_outbox"):
                db.execute("DELETE FROM ticket_outbox WHERE ticket_id=? AND delivery_status='pending'", (ticket_id,))
            if table_exists(db, "cnx_direct_recovery"):
                db.execute(
                    "UPDATE cnx_direct_recovery SET state='cancelled',active_run_id=NULL,next_attempt_at=NULL,last_error=?,updated_at=? WHERE ticket_id=?",
                    (reason[:2000], stamp, ticket_id),
                )
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if old in s:
              s = s.replace(old, new, 1)
          elif 'DELETE FROM ticket_outbox WHERE ticket_id=? AND delivery_status=' not in s:
              raise SystemExit('cancel outbox block missing')

          s = s.replace(
              "status='cancelled',worker_id=NULL,lease_token=NULL,lease_expires_at=NULL,heartbeat_at=NULL,failure_class='interrupted',failure_message=?,updated_at=?",
              "status='cancelled',worker_id=NULL,lease_token=NULL,lease_expires_at=NULL,heartbeat_at=NULL,failure_class=NULL,failure_message=?,updated_at=?",
          )

          s = s.replace(
              'def enable(root: Path) -> dict[str, Any]:\n    initialize(root)\n    workspace = root.parent\n',
              'def enable(root: Path) -> dict[str, Any]:\n    initialize(root)\n    terminal_fences = reconcile_terminal_fences(root)\n    workspace = root.parent\n',
              1,
          )
          s = s.replace(
              '        "sessionBootstrap": session_bootstrap,\n        "recoveredTickets": recovered,\n',
              '        "sessionBootstrap": session_bootstrap,\n        "terminalFences": terminal_fences,\n        "recoveredTickets": recovered,\n',
              1,
          )
          s = s.replace(
              'def start_managed(root: Path, provider: bool = True) -> dict[str, Any]:\n    initialize(root)\n    prior = load_state(root)\n',
              'def start_managed(root: Path, provider: bool = True) -> dict[str, Any]:\n    initialize(root)\n    terminal_fences = reconcile_terminal_fences(root)\n    prior = load_state(root)\n',
              1,
          )
          s = s.replace(
              '    return {"state": state, "lifecycle": parse_json_output(result.stdout), "sessionBootstrap": session_bootstrap, "recoveredTickets": recovered}\n',
              '    return {"state": state, "lifecycle": parse_json_output(result.stdout), "sessionBootstrap": session_bootstrap, "terminalFences": terminal_fences, "recoveredTickets": recovered}\n',
              1,
          )
          p.write_text(s, encoding='utf-8')

      - name: Patch Host regression tests
        shell: python
        run: |
          from pathlib import Path

          p = Path('tests/test_host_controller.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '        CREATE TABLE ticket_outbox(outbox_id INTEGER PRIMARY KEY AUTOINCREMENT,ticket_id TEXT UNIQUE,owner_session_key TEXT,terminal_status TEXT,payload_json TEXT,delivery_status TEXT,created_at TEXT);\n        """)\n',
              '        CREATE TABLE ticket_outbox(outbox_id INTEGER PRIMARY KEY AUTOINCREMENT,ticket_id TEXT UNIQUE,owner_session_key TEXT,terminal_status TEXT,payload_json TEXT,delivery_status TEXT,created_at TEXT);\n        CREATE TABLE cnx_direct_recovery(ticket_id TEXT PRIMARY KEY,state TEXT,active_run_id TEXT,next_attempt_at TEXT,last_error TEXT,updated_at TEXT);\n        """)\n',
              1,
          )
          start = s.index('    def test_ticket_cancel_is_terminal_and_enqueues_outbox(self):')
          end = s.index('\n    def test_passthrough_supervisor_does_nothing', start)
          replacement = '''    def test_ticket_cancel_is_terminal_silent_and_suppresses_recovery(self):
              with tempfile.TemporaryDirectory() as tmp:
                  root = Path(tmp) / ".cogent"
                  db = self._ticket_db(root)
                  db.execute("INSERT INTO tickets(ticket_id,owner_session_key,status,workflow_eligible,created_at,updated_at) VALUES ('T2','S2','waiting',1,'2026-01-01T00:00:00+00:00','2026-01-01T00:00:00+00:00')")
                  db.execute("INSERT INTO ticket_outbox(ticket_id,owner_session_key,terminal_status,payload_json,delivery_status,created_at) VALUES ('T2','S2','failed','{}','pending','2026-01-01T00:00:00+00:00')")
                  db.execute("INSERT INTO cnx_direct_recovery(ticket_id,state,active_run_id,next_attempt_at,last_error,updated_at) VALUES ('T2','pending','run-old','2026-01-02T00:00:00+00:00',NULL,'2026-01-01T00:00:00+00:00')")
                  db.commit(); db.close()
                  result = cnx_host.cancel_ticket(root, "T2", "operator cancelled")
                  self.assertTrue(result["changed"])
                  db = sqlite3.connect(cnx_host.ticket_db(root))
                  self.assertEqual(db.execute("SELECT status,failure_class FROM tickets WHERE ticket_id='T2'").fetchone(), ("cancelled", None))
                  self.assertEqual(db.execute("SELECT count(*) FROM ticket_outbox WHERE ticket_id='T2' AND delivery_status='pending'").fetchone()[0], 0)
                  self.assertEqual(db.execute("SELECT state,active_run_id,next_attempt_at FROM cnx_direct_recovery WHERE ticket_id='T2'").fetchone(), ("cancelled", None, None))
                  db.close()

              def test_terminal_fence_cleans_stale_cancelled_delivery_and_terminal_recovery(self):
                  with tempfile.TemporaryDirectory() as tmp:
                      root = Path(tmp) / ".cogent"
                      db = self._ticket_db(root)
                      db.execute("INSERT INTO tickets(ticket_id,owner_session_key,status,workflow_eligible,failure_class,created_at,updated_at) VALUES ('TC','S','cancelled',0,'interrupted','2026-01-01T00:00:00+00:00','2026-01-01T00:00:00+00:00')")
                      db.execute("INSERT INTO tickets(ticket_id,owner_session_key,status,workflow_eligible,failure_class,created_at,updated_at) VALUES ('TF','S','failed',1,'capability','2026-01-01T00:00:00+00:00','2026-01-01T00:00:00+00:00')")
                      db.execute("INSERT INTO ticket_outbox(ticket_id,owner_session_key,terminal_status,payload_json,delivery_status,created_at) VALUES ('TC','S','cancelled','{}','pending','2026-01-01T00:00:00+00:00')")
                      db.execute("INSERT INTO cnx_direct_recovery(ticket_id,state,active_run_id,next_attempt_at,last_error,updated_at) VALUES ('TC','pending','r1','2026-01-02T00:00:00+00:00',NULL,'2026-01-01T00:00:00+00:00')")
                      db.execute("INSERT INTO cnx_direct_recovery(ticket_id,state,active_run_id,next_attempt_at,last_error,updated_at) VALUES ('TF','pending','r2','2026-01-02T00:00:00+00:00',NULL,'2026-01-01T00:00:00+00:00')")
                      db.commit(); db.close()
                      result = cnx_host.reconcile_terminal_fences(root)
                      self.assertEqual(result["cancelledOutboxSuppressed"], 1)
                      self.assertEqual(result["terminalRecoverySuppressed"], 2)
                      db = sqlite3.connect(cnx_host.ticket_db(root))
                      self.assertEqual(db.execute("SELECT failure_class FROM tickets WHERE ticket_id='TC'").fetchone()[0], None)
                      self.assertEqual(db.execute("SELECT count(*) FROM ticket_outbox WHERE ticket_id='TC'").fetchone()[0], 0)
                      self.assertEqual(db.execute("SELECT count(*) FROM cnx_direct_recovery WHERE state='cancelled'").fetchone()[0], 2)
                      db.close()
          '''
          replacement = '\n'.join(line[14:] if line.startswith('              ') else line for line in replacement.splitlines())
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')

      - name: Patch plugin startup cleanup
        shell: python
        run: |
          from pathlib import Path

          p = Path('plugins/cogentnexus-rotation/src/v090.ts')
          s = p.read_text(encoding='utf-8')
          needle = '  try{db.exec("BEGIN IMMEDIATE");const rows=db.prepare("SELECT ticket_id,prompt,status,workflow_eligible,failure_class,failure_message FROM tickets WHERE status IN (\'waiting\',\'failed\') AND workflow_id IS NULL AND ((workflow_eligible=1 AND failure_class=\'interrupted\') OR (status=\'failed\' AND workflow_eligible=0 AND failure_class=\'permanent\' AND failure_message=\'Reply operation aborted by user\')) ORDER BY created_at").all() as any[];\n'
          replacement = '  try{db.exec("BEGIN IMMEDIATE");\n    db.prepare("DELETE FROM ticket_outbox WHERE delivery_status=\'pending\' AND ticket_id IN (SELECT ticket_id FROM tickets WHERE status=\'cancelled\')").run();\n    db.prepare("UPDATE tickets SET failure_class=NULL WHERE status=\'cancelled\' AND failure_class IS NOT NULL").run();\n    db.prepare("UPDATE cnx_direct_recovery SET state=\'cancelled\',active_run_id=NULL,next_attempt_at=NULL,last_error=COALESCE(last_error,\'terminal ticket fence\'),updated_at=? WHERE state<>\'cancelled\' AND ticket_id IN (SELECT ticket_id FROM tickets WHERE status IN (\'completed\',\'failed\',\'cancelled\'))").run(stamp);\n    const rows=db.prepare("SELECT ticket_id,prompt,status,workflow_eligible,failure_class,failure_message FROM tickets WHERE status IN (\'waiting\',\'failed\') AND workflow_id IS NULL AND ((workflow_eligible=1 AND failure_class=\'interrupted\') OR (status=\'failed\' AND workflow_eligible=0 AND failure_class=\'permanent\' AND failure_message=\'Reply operation aborted by user\')) ORDER BY created_at").all() as any[];\n'
          if needle not in s:
              raise SystemExit('prepareV090RecoveryState marker missing')
          s = s.replace(needle, replacement, 1)
          p.write_text(s, encoding='utf-8')

      - name: Add plugin regression test
        shell: python
        run: |
          from pathlib import Path

          p = Path('plugins/cogentnexus-rotation/src/v090.test.ts')
          s = p.read_text(encoding='utf-8')
          anchor = '  it("keeps Direct Recovery synthetic prompts outside human Ticket intake", () => {\n'
          test = '''  it("cleans stale cancelled delivery and terminal recovery before startup", () => {
              const root = mkdtempSync(join(tmpdir(), "cnx-v090-terminal-fence-"));
              try {
                const path=join(root,"tickets.sqlite3"),store=new TicketStore(path);
                const ticket=store.accept({runId:"cancelled-old",ownerSessionKey:"agent:main:dashboard:test",prompt:"งานเก่า"});
                store.route(ticket.ticketId,false);
                expect(markDirectRecovery(path,{runId:"cancelled-old",mode:"resume",message:"provider interrupted"})).toBe(true);
                const db=new DatabaseSync(path);
                db.prepare("UPDATE tickets SET status='cancelled',failure_class='interrupted' WHERE ticket_id=?").run(ticket.ticketId);
                db.prepare("INSERT INTO ticket_outbox(ticket_id,owner_session_key,terminal_status,payload_json,delivery_status,delivery_attempts,created_at) VALUES (?,?,'cancelled','{}','pending',1,?)").run(ticket.ticketId,"agent:main:dashboard:test",new Date().toISOString());
                db.close();
                prepareV090RecoveryState(root,{ticketDatabasePath:path});
                const verify=new DatabaseSync(path,{readOnly:true});
                expect(verify.prepare("SELECT status,failure_class FROM tickets WHERE ticket_id=?").get(ticket.ticketId)).toEqual({status:"cancelled",failure_class:null});
                expect(verify.prepare("SELECT COUNT(*) AS count FROM ticket_outbox WHERE ticket_id=? AND delivery_status='pending'").get(ticket.ticketId)).toEqual({count:0});
                expect(verify.prepare("SELECT state,active_run_id,next_attempt_at FROM cnx_direct_recovery WHERE ticket_id=?").get(ticket.ticketId)).toEqual({state:"cancelled",active_run_id:null,next_attempt_at:null});
                verify.close();
              } finally { rmSync(root,{recursive:true,force:true}); }
            });

          '''
          test = '\n'.join(line[10:] if line.startswith('          ') else line for line in test.splitlines())
          if anchor not in s:
              raise SystemExit('v090 test anchor missing')
          s = s.replace(anchor, test + anchor, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit patch and remove one-shot workflow
        run: |
          rm -f .github/workflows/v090-live-cancellation-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skills/cogentnexus/scripts/host.py tests/test_host_controller.py plugins/cogentnexus-rotation/src/v090.ts plugins/cogentnexus-rotation/src/v090.test.ts .github/workflows/v090-live-cancellation-fix.yml
          git commit -m 'Fix silent cancellation terminal fences'
          git push origin HEAD:agent/v0.9.0-intent-boundary

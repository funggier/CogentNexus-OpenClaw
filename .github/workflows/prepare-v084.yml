name: Finalize v0.8.4 baseline

on:
  push:
    branches:
      - agent/direct-recovery-v084
    paths:
      - .github/workflows/prepare-v084.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/direct-recovery-v084
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Align v0.8.4 canonical delivery wording
        run: python scripts/prepare_v084.py
      - name: Verify release metadata consistency
        run: python scripts/check_baseline_consistency.py
      - name: Commit canonical baseline update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BASELINE.md
          git diff --cached --check
          git commit -m "Align v0.8.4 Direct delivery baseline"
          git push origin HEAD:agent/direct-recovery-v084

name: Update delivery regression tests

on:
  push:
    branches:
      - "baseline/v0.8.0-clean"

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: baseline/v0.8.0-clean
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: python scripts/update_delivery_regression_tests.py
      - name: Run plugin tests
        working-directory: plugins/cogentnexus-rotation
        run: |
          npm ci
          npm test
      - name: Commit integration test update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/cogentnexus-rotation/src/index.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Test delivery receipts and post-compaction continuation"
          git push origin HEAD:baseline/v0.8.0-clean

name: Apply v0.8.3 session continuity

on:
  push:
    branches:
      - fix/windows-stop-v083

permissions:
  contents: write

concurrency:
  group: apply-session-continuity-v083
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/windows-stop-v083
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/cogentnexus-rotation/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - name: Apply session continuity source patch
        run: python scripts/apply_session_continuity_v083.py
      - name: Add session continuity regression tests
        run: python scripts/add_session_continuity_tests_v083.py
      - name: Remove temporary patch artifacts
        run: git rm -f scripts/apply_session_continuity_v083.py scripts/add_session_continuity_tests_v083.py .github/workflows/apply-session-continuity-v083.yml
      - name: Compile Host and workflow runtimes
        run: python -m py_compile skills/cogentnexus/scripts/host.py skills/cogentnexus/scripts/workflow.py
      - name: Run Python regression suite
        run: python -m unittest discover -s tests -v
      - name: Baseline consistency
        run: python scripts/check_baseline_consistency.py
      - name: Runtime self-tests
        run: |
          python skills/cogentnexus/scripts/runtime.py self-test
          python skills/cogentnexus/scripts/workflow.py self-test
      - run: npm ci
        working-directory: plugins/cogentnexus-rotation
      - run: npm test
        working-directory: plugins/cogentnexus-rotation
      - run: npm run evaluation
        working-directory: plugins/cogentnexus-rotation
      - run: npm audit --omit=dev
        working-directory: plugins/cogentnexus-rotation
      - run: npm run plugin:validate
        working-directory: plugins/cogentnexus-rotation
      - name: Commit clean session continuity patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          git commit -m 'Repair OpenClaw session bootstrap and succession continuity'
          git push origin HEAD:fix/windows-stop-v083

name: Apply v0.8.1 patch

on:
  push:
    branches:
      - fix/v0.8.1-windows-cli-shim

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/v0.8.1-windows-cli-shim
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: python .github/patch_v081.py
      - name: Refresh package lock
        working-directory: plugins/cogentnexus-rotation
        run: npm install --package-lock-only --ignore-scripts
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile skills/cogentnexus/scripts/host.py skills/cogentnexus/scripts/startup.py
      - run: npm test
        working-directory: plugins/cogentnexus-rotation
      - name: Remove temporary patch machinery
        run: rm -f .github/patch_v081.py .github/workflows/apply-v081-patch.yml
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Windows OpenClaw shim handling for v0.8.1'
          git push origin HEAD:fix/v0.8.1-windows-cli-shim

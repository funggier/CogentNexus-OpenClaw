name: v090-lock-refresh

on:
  push:
    branches:
      - agent/v0.9.0-intent-boundary
    paths:
      - .github/workflows/v090-lock-refresh.yml
      - plugins/cogentnexus-rotation/package.json
      - VERSION

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/v0.9.0-intent-boundary
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Refresh package lock metadata
        working-directory: plugins/cogentnexus-rotation
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify lock version
        working-directory: plugins/cogentnexus-rotation
        run: node -e "const p=require('./package-lock.json'); if(p.version!=='0.9.0'||p.packages[''].version!=='0.9.0') process.exit(1)"
      - name: Commit lock refresh when needed
        run: |
          if git diff --quiet -- plugins/cogentnexus-rotation/package-lock.json; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/cogentnexus-rotation/package-lock.json
          git commit -m 'Refresh v0.9.0 package lock metadata'
          git push origin HEAD:agent/v0.9.0-intent-boundary

name: Apply early delivery receipt buffer

on:
  push:
    branches: ["baseline/v0.8.0-clean"]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: baseline/v0.8.0-clean
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: python scripts/apply_early_delivery_receipt_patch.py
      - name: Compile and test
        working-directory: plugins/cogentnexus-rotation
        run: |
          npm ci
          npm run build
          npm test
      - name: Commit runtime patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/cogentnexus-rotation/src/index.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Buffer delivery receipts that arrive before response readiness"
          git push origin HEAD:baseline/v0.8.0-clean

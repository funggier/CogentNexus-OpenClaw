name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify CogentNexus-OpenClaw namespace isolation
        run: python scripts/check_namespace_isolation.py
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: plugins/cogentnexus-openclaw/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_baseline_consistency.py
      - run: python skills/cogentnexus-openclaw/scripts/validate.py --workspace-singleton
      - run: python skills/cogentnexus-openclaw/scripts/cogent.py self-test
      - run: python skills/cogentnexus-openclaw/scripts/runtime.py self-test
      - name: Workflow self-test
        if: runner.os != 'Windows'
        run: python skills/cogentnexus-openclaw/scripts/workflow.py self-test
      - name: Workflow self-test on Windows with one teardown-race retry
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python skills/cogentnexus-openclaw/scripts/workflow.py self-test
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Workflow self-test hit the known detached-controller teardown race; retrying once."
            python skills/cogentnexus-openclaw/scripts/workflow.py self-test
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: >-
          python -m py_compile
          skills/cogentnexus-openclaw/scripts/host.py
          skills/cogentnexus-openclaw/scripts/host_v091.py
          skills/cogentnexus-openclaw/scripts/host_control.py
          skills/cogentnexus-openclaw/scripts/host_control_v091.py
          skills/cogentnexus-openclaw/scripts/lifecycle_v091.py
          skills/cogentnexus-openclaw/scripts/startup.py
          skills/cogentnexus-openclaw/scripts/startup_v091.py
          skills/cogentnexus-openclaw/scripts/provider.py
          skills/cogentnexus-openclaw/scripts/checks.py
          skills/cogentnexus-openclaw/scripts/checks_v092.py
          skills/cogentnexus-openclaw/scripts/cnxclaw.py
          skills/cogentnexus-openclaw/scripts/openclaw_route_v092.py
          skills/cogentnexus-openclaw/scripts/openclaw_runtime_boundary_v092.py
          skills/cogentnexus-openclaw/scripts/provider_events_v092.py
          skills/cogentnexus-openclaw/scripts/provider_recovery_v092.py
          skills/cogentnexus-openclaw/scripts/host_provider_v092.py
          skills/cogentnexus-openclaw/scripts/host_v092.py
          skills/cogentnexus-openclaw/scripts/host_control_v092.py
          skills/cogentnexus-openclaw/scripts/startup_v092.py
          skills/cogentnexus-openclaw/scripts/lifecycle_v092.py
          skills/cogentnexus-openclaw/scripts/namespace_ownership.py
      - run: python -m pytest -q
      - run: python benchmarks/single-ai-hybrid-e2e/test_validator.py
      - name: Test plugin path migration helper
        shell: bash
        run: |
          printf '["/tmp/cogentnexus-openclaw","/tmp/keep"]' | \
            python scripts/filter_plugin_paths.py --plugin-id cogentnexus-openclaw | \
            python -c 'import json,sys; assert json.load(sys.stdin) == ["/tmp/keep"]'
      - name: Validate Windows PowerShell script syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $files = @(
            'scripts/install.ps1',
            'scripts/accept-v092-windows.ps1',
            'scripts/accept-v092-windows-ps51.ps1',
            'scripts/invoke-root-process-exact.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error "$file :: $_" }
              exit 1
            }
          }
      - name: Smoke-test Windows PowerShell 5.1 acceptance serializer
        if: runner.os == 'Windows'
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\accept-v092-windows-ps51.ps1
          -SerializerSelfTestOnly
      - name: Smoke-test exact numeric root-process exit capture
        if: runner.os == 'Windows'
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\invoke-root-process-exact.ps1 -SelfTest
      - name: Validate POSIX installer syntax
        if: runner.os != 'Windows'
        run: sh -n scripts/install.sh
      - run: npm ci
        working-directory: plugins/cogentnexus-openclaw
      - run: npm test
        working-directory: plugins/cogentnexus-openclaw
      - run: npm run evaluation
        working-directory: plugins/cogentnexus-openclaw
      - run: npm audit --omit=dev
        working-directory: plugins/cogentnexus-openclaw
      - run: npm run plugin:validate
        working-directory: plugins/cogentnexus-openclaw

  package-dry-run:
    name: package dry-run (no publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Verify CogentNexus-OpenClaw v0.9.3 metadata
        shell: bash
        run: |
          set -euo pipefail
          core=$(tr -d '\r\n' < VERSION)
          package_version=$(node -p "require('./plugins/cogentnexus-openclaw/package.json').version")
          manifest_version=$(node -p "JSON.parse(require('fs').readFileSync('./plugins/cogentnexus-openclaw/openclaw.plugin.json')).version")
          lock_version=$(node -p "require('./plugins/cogentnexus-openclaw/package-lock.json').version")
          lock_root_version=$(node -p "require('./plugins/cogentnexus-openclaw/package-lock.json').packages[''].version")
          test "$core" = "0.9.3"
          test "$package_version" = "0.9.3"
          test "$package_version" = "$manifest_version"
          test "$package_version" = "$lock_version"
          test "$package_version" = "$lock_root_version"
          test -s docs/BASELINE.md
          test -s docs/INSTALL.md
          test -s docs/INSTALL.th.md
          test -s docs/releases/v0.9.3.md
      - name: Build and validate plugin payload
        working-directory: plugins/cogentnexus-openclaw
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run plugin:validate
      - name: Build and verify release archives without publishing
        shell: bash
        run: |
          set -euo pipefail
          name="cogentnexus-openclaw-v0.9.3"
          stage="$RUNNER_TEMP/$name"
          out="$RUNNER_TEMP/release"
          required=(
            "plugins/cogentnexus-openclaw/dist/v091-release-entry.js"
            "plugins/cogentnexus-openclaw/scripts/bootstrap-ticket-db.mjs"
            "plugins/cogentnexus-openclaw/openclaw.plugin.json"
            "plugins/cogentnexus-openclaw/README.md"
            "plugins/cogentnexus-openclaw/package.json"
          )
          mkdir -p "$stage" "$out"
          rsync -a --exclude '.git/' --exclude '.cogentnexus-openclaw/' --exclude 'node_modules/' ./ "$stage/"
          for rel in "${required[@]}"; do
            test -f "$stage/$rel"
          done
          tar -C "$RUNNER_TEMP" -czf "$out/$name.tar.gz" "$name"
          (cd "$RUNNER_TEMP" && zip -qr "$out/$name.zip" "$name")
          (cd "$out" && sha256sum "$name.tar.gz" "$name.zip" > SHA256SUMS.txt)
          (cd "$out" && sha256sum -c SHA256SUMS.txt)
          tar -tzf "$out/$name.tar.gz" > "$out/tar-contents.txt"
          unzip -Z1 "$out/$name.zip" > "$out/zip-contents.txt"
          for rel in "${required[@]}"; do
            grep -Fx "$name/$rel" "$out/tar-contents.txt"
            grep -Fx "$name/$rel" "$out/zip-contents.txt"
          done
          unzip -tq "$out/$name.zip"
          test -s "$out/$name.tar.gz"
          test -s "$out/$name.zip"
          test -s "$out/SHA256SUMS.txt"

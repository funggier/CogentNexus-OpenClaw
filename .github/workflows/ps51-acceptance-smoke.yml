name: PS5.1 Acceptance Smoke

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  serializer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run exact Windows PowerShell 5.1 acceptance serializer self-test
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\accept-v092-windows-ps51.ps1
          -SerializerSelfTestOnly

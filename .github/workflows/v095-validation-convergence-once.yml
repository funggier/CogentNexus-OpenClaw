name: v0.9.5 validation convergence once

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/v0.9.5-validation-convergence]

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply exact v0.9.5 convergence fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace(path, old, new, required=True):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              if old not in s:
                  if required:
                      raise SystemExit(f"pattern not found in {path}: {old!r}")
                  return False
              updated = s.replace(old, new)
              if updated == s:
                  raise SystemExit(f"no change made to {path}")
              p.write_text(updated, encoding="utf-8")
              return True

          # Production: add the externally-bound application-data argument to
          # _exact_rollover_state and every internal invocation that lacks it.
          p = Path("skills/cogentnexus-openclaw/scripts/namespace_ownership.py")
          s = p.read_text(encoding="utf-8")
          signature = re.compile(r"def _exact_rollover_state\(\*, root: Path, workspace: Path,\n")
          if "application_data: Path" not in s[s.find("def _exact_rollover_state"):s.find("def _exact_rollover_state") + 300]:
              s, count = signature.subn(
                  "def _exact_rollover_state(*, root: Path, workspace: Path,\n"
                  "                          application_data: Path,\n",
                  s,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("could not locate _exact_rollover_state signature")

          call_re = re.compile(
              r"(?P<indent>^[ ]*)state = _exact_rollover_state\(\n"
              r"(?P<body>(?:^[ ]+.*\n)+?)"
              r"(?P=indent)\)",
              re.MULTILINE,
          )

          def patch_call(match):
              body = match.group("body")
              indent = match.group("indent") + "    "
              if "application_data=" in body:
                  return match.group(0)
              if 'root=paths["stateRoot"]' in body:
                  app_line = indent + 'application_data=app_data or paths["applicationData"],\n'
              else:
                  app_line = indent + "application_data=application_data,\n"
              lines = body.splitlines(True)
              for i, line in enumerate(lines):
                  if "workspace=workspace" in line:
                      lines.insert(i + 1, app_line)
                      break
              else:
                  raise SystemExit("could not place application_data in _exact_rollover_state call")
              return match.group("indent") + "state = _exact_rollover_state(\n" + "".join(lines) + match.group("indent") + ")"

          s, patched_calls = call_re.subn(patch_call, s)
          if patched_calls < 2:
              raise SystemExit(f"expected at least two _exact_rollover_state call sites, matched {patched_calls}")

          helper_start = s.find("def _exact_rollover_state")
          helper_end = s.find("\ndef ", helper_start + 10)
          helper = s[helper_start:helper_end if helper_end >= 0 else len(s)]
          marker = '    paths = expected_paths(workspace)\n    mode = _require_passthrough(root)'
          if marker in helper:
              helper = helper.replace(
                  marker,
                  '    paths = expected_paths(workspace)\n'
                  '    application_data = application_data.resolve(strict=False)\n'
                  '    if application_data.name.lower() != DISPLAY_NAME.lower() or _contained(\n'
                  '        application_data, paths["openclawState"]\n'
                  '    ):\n'
                  '        raise RuntimeError("rollover application-data root must be the external CogentNexus-OpenClaw boundary")\n'
                  '    mode = _require_passthrough(root)',
                  1,
              )
              s = s[:helper_start] + helper + s[helper_end if helper_end >= 0 else len(s):]
          p.write_text(s, encoding="utf-8")

          # Current-version fixture defaults.
          replace(
              "tests/test_plugin_generation_rollover.py",
              'def write_plugin(root: Path, *, marker: str = "same", version: str = "0.9.4") -> Path:',
              'def write_plugin(root: Path, *, marker: str = "same", version: str = "0.9.5") -> Path:',
          )
          replace(
              "tests/test_plugin_generation_rollover.py",
              '        "version": "0.9.4",\n        "rootDir": ownership._canonical(paths["new_plugin"]),',
              '        "version": "0.9.5",\n        "rootDir": ownership._canonical(paths["new_plugin"]),',
              required=False,
          )

          replace(
              "tests/test_namespace_ownership.py",
              'def write_plugin(root: Path, *, marker="same", version="0.9.4") -> Path:',
              'def write_plugin(root: Path, *, marker="same", version="0.9.5") -> Path:',
              required=False,
          )
          replace(
              "tests/test_namespace_ownership.py",
              '                                       launcher=launcher, version="0.9.4", migration_source=migration_source)',
              '                                       launcher=launcher, version=ownership.INSTALLED_VERSION, migration_source=migration_source)',
              required=False,
          )
          replace(
              "tests/test_namespace_ownership.py",
              '                                       launcher=launcher, version="0.9.4", migration_source=migration_source)',
              '                                       launcher=launcher, version=ownership.INSTALLED_VERSION, migration_source=migration_source)',
              required=False,
          )
          replace(
              "tests/test_namespace_ownership.py",
              '                                       launcher=launcher, version="0.9.3", migration_source=migration_source)',
              '                                       launcher=launcher, version=ownership.INSTALLED_VERSION, migration_source=migration_source)',
              required=False,
          )
          replace(
              "tests/test_namespace_ownership.py",
              'payload["installedVersion"] = "0.9.3"',
              'payload["installedVersion"] = "0.9.4"',
              required=False,
          )
          replace(
              "tests/test_namespace_ownership.py",
              'launcher=launcher, version="0.9.4",',
              'launcher=launcher, version=ownership.INSTALLED_VERSION,',
              required=False,
          )

          lp = Path("tests/test_lifecycle_v092.py")
          ls = lp.read_text(encoding="utf-8")
          ls = ls.replace('                "0.9.4",\n', '                "0.9.5",\n')
          ls = ls.replace('write_payload(managed, "0.9.4")', 'write_payload(managed, "0.9.5")')
          ls = ls.replace('write_payload(first, "0.9.4"', 'write_payload(first, "0.9.5"')
          ls = ls.replace('write_payload(second, "0.9.4"', 'write_payload(second, "0.9.5"')
          lp.write_text(ls, encoding="utf-8")

          replace("tests/test_baseline_checker_v093.py",
                  'assert (tree / "VERSION").read_text(encoding="utf-8").strip() == "0.9.4"',
                  'assert (tree / "VERSION").read_text(encoding="utf-8").strip() == "0.9.5"',
                  required=False)
          replace("tests/test_baseline_contract.py",
                  'self.assertEqual(core_version, "0.9.4")',
                  'self.assertEqual(core_version, "0.9.5")',
                  required=False)
          replace("tests/test_baseline_contract.py",
                  'self.assertEqual(bridge_version, "0.9.4")',
                  'self.assertEqual(bridge_version, "0.9.5")',
                  required=False)
          replace("tests/test_namespace_install_contract.py",
                  'name="cogentnexus-openclaw-v0.9.4"',
                  'name="cogentnexus-openclaw-v0.9.5"',
                  required=False)
          replace("tests/test_release_version_094_contract.py",
                  'EXPECTED = "0.9.4"',
                  'EXPECTED = "0.9.5"',
                  required=False)
          replace("tests/test_release_version_094_contract.py",
                  'assert "v0.9.4" in text, relative',
                  'assert "v0.9.5" in text, relative',
                  required=False)
          replace("docs/CLEAN_REINSTALL.md",
                  'then runs the v0.9.4 installer',
                  'then runs the v0.9.5 installer',
                  required=False)
          replace("docs/CLEAN_REINSTALL.th.md",
                  'ติดตั้ง v0.9.4 ใหม่',
                  'ติดตั้ง v0.9.5 ใหม่',
                  required=False)

          # Add a clearly-marked release-candidate version to current-facing docs
          # without rewriting historical v0.9.4 references embedded in them.
          current_docs = [
              "README.md", "docs/BASELINE.md", "docs/CURRENT_STATE.md",
              "docs/INSTALL.md", "docs/INSTALL.th.md", "docs/PROVIDERS.md",
              "docs/CHECK_SYSTEM.md", "docs/CLEAN_REINSTALL.md",
              "docs/CLEAN_REINSTALL.th.md", "skills/cogentnexus-openclaw/SKILL.md",
              "skills/cogentnexus-openclaw/templates/lifecycle/README.md",
              "plugins/cogentnexus-openclaw/README.md",
          ]
          for relative in current_docs:
              p = Path(relative)
              text = p.read_text(encoding="utf-8")
              if "v0.9.5" not in text:
                  p.write_text(
                      "**Current v0.9.5 release candidate:** pre-publication validation in progress.\n\n" + text,
                      encoding="utf-8",
                  )

      - name: Check focused regression set
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m pytest -q \
            tests/test_plugin_generation_rollover.py \
            tests/test_interrupted_reentry_semantic_matrix.py \
            tests/test_namespace_ownership.py \
            tests/test_lifecycle_v092.py \
            tests/test_baseline_checker_v093.py \
            tests/test_baseline_contract.py \
            tests/test_namespace_install_contract.py \
            tests/test_clean_reinstall_docs_contract.py \
            tests/test_release_version_094_contract.py

      - name: Commit fixes and remove one-shot workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/v095-validation-convergence-once.yml
          git add -A
          git diff --cached --check
          git diff --cached --name-status
          git commit -m 'fix: converge v0.9.5 validation contracts'
          git push origin HEAD:fix/v0.9.5-validation-convergence

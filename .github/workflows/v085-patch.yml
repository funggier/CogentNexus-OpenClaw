name: v0.8.5 candidate patch

on:
  push:
    branches:
      - agent/direct-recovery-v085

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v085-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/direct-recovery-v085
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source patch
        run: python scripts/v085_apply_patch.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/cogentnexus/scripts/host.py plugins/cogentnexus-rotation/src/ticket-store.ts
          git commit -m "Fence Host promotion against active Direct recovery [v085-patch]"
          git push origin HEAD:agent/direct-recovery-v085

name: v0.8.5 candidate fix

on:
  push:
    branches:
      - agent/direct-recovery-v085

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[v085-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/direct-recovery-v085
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply candidate fix
        run: python scripts/v085_fix_tests.py
      - name: Commit candidate fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No fix changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/cogentnexus-rotation/src/v085.test.ts skills/cogentnexus/scripts/host_delivery.py
          git commit -m "Fix v0.8.5 outbox assertion and preserve delivery order [v085-fix]"
          git push origin HEAD:agent/direct-recovery-v085

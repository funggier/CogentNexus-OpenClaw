stdin: false
tty: false
livenessProbe:
  exec:
    command: ["{{PYTHON}}", "{{RUNTIME}}", "--root", "{{ROOT}}", "supervisor", "tick"]
  periodSeconds: 300
  timeoutSeconds: 90
readinessProbe:
  exec:
    command: ["{{PYTHON}}", "{{RUNTIME}}", "--root", "{{ROOT}}", "supervisor", "tick"]
  periodSeconds: 60
  timeoutSeconds: 30

name: Runtime Test Portability Repair

on:
  push:
    branches:
      - agent/v0.9.3-full-stabilization
    paths:
      - .github/workflows/cnx-stabilization-runtime-test-portability.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Apply exact runtime-authority test portability repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_runtime_authority_integration.py")
          text = path.read_text(encoding="utf-8")

          old_boundary = "        self.assertFalse(runtime_authority.validate_runtime(bad_manifest))"
          new_boundary = "        self.assertFalse(\n            runtime_authority.validate_runtime(\n                bad_manifest, self.local_base / \"CogentNexus-OpenClaw\"\n            )\n        )"
          if text.count(old_boundary) != 1:
              raise SystemExit(f"expected one boundary assertion target, found {text.count(old_boundary)}")
          text = text.replace(old_boundary, new_boundary)

          old_recreate = "    def test_install_over_validates_then_recreates_missing_runtime(self):"
          new_recreate = "    @unittest.skipUnless(IS_WINDOWS, \"runtime recreation integration is Windows-specific\")\n    def test_install_over_validates_then_recreates_missing_runtime(self):"
          if text.count(old_recreate) != 1:
              raise SystemExit(f"expected one recreate test target, found {text.count(old_recreate)}")
          text = text.replace(old_recreate, new_recreate)

          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/cnx-stabilization-runtime-test-portability.yml
          git diff --check
      - name: Verify namespace and full Python suite on Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python scripts/check_namespace_isolation.py
          python -m pytest -q
      - name: Publish exact test portability repair and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CogentNexus-OpenClaw Stabilization"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_runtime_authority_integration.py .github/workflows/cnx-stabilization-runtime-test-portability.yml
          git diff --cached --check
          git commit -m "test(ci): isolate Windows runtime integration semantics"
          git push origin HEAD:agent/v0.9.3-full-stabilization
